services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - WEBUI_PORT=8082
    volumes:
      - /home/h/docker/media-stack/appdata/qbittorrent:/config
      - /mnt/storage_pool/data:/data
    ports:
      - 8082:8082
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:develop
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /home/h/docker/media-stack/appdata/prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /home/h/docker/media-stack/appdata/radarr:/config
      - /mnt/storage_pool/data:/data
    ports:
      - 7878:7878
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /home/h/docker/media-stack/appdata/sonarr:/config
      - /mnt/storage_pool/data:/data
    ports:
      - 8989:8989
    restart: unless-stopped

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    user: "1000:1000"
    init: true
    ports:
      - 5055:5055
    volumes:
      - /home/h/docker/media-stack/appdata/seerr:/app/config
    restart: unless-stopped

#  plex:
#    image: lscr.io/linuxserver/plex:latest
#    container_name: plex
#    network_mode: host
#    environment:
#      - PUID=1000
#      - PGID=1000
#      - TZ=Etc/UTC
#      - VERSION=docker
#    volumes:
#      - /home/h/docker/media-stack/appdata/plex:/config
#      - /mnt/storage_pool/data/media:/data/media
#    restart: unless-stopped

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /home/h/docker/media-stack/appdata/jellyfin:/config
      - /mnt/storage_pool/data/media:/data/media
    ports:
      - 8096:8096
    restart: unless-stopped

  watchstate:
    image: ghcr.io/arabcoders/watchstate:latest
    container_name: watchstate
    user: "1000:1000"
    ports:
      - 8001:8080
    volumes:
      - /home/h/docker/media-stack/appdata/watchstate:/config
    restart: unless-stopped
